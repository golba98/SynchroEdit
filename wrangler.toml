name = "syncroedit"
main = "src-worker/index.js"
compatibility_date = "2026-06-10"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

[[d1_databases]]
binding = "DB"
database_name = "syncroedit-db"
database_id = "22d0142f-5997-4622-bd2d-33eab48beeea"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "DOCUMENT_SYNC_OBJECT"
class_name = "SyncroDocumentObject"

[[durable_objects.bindings]]
name = "RATE_LIMIT_OBJECT"
class_name = "SyncroRateLimitObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SynchroDocumentObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SynchroRateLimitObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SynchroDocumentObject", "SynchroRateLimitObject"]

[[migrations]]
tag = "v4"
renamed_classes = [
  { from = "SynchroDocumentObject", to = "SyncroDocumentObject" },
  { from = "SynchroRateLimitObject", to = "SyncroRateLimitObject" },
]

[vars]
EMAIL_FROM = "SyncroEdit <no-reply@syncroedit.online>"
APP_NAME = "SyncroEdit"
APP_URL = "https://syncroedit.online"

[env.local]
name = "syncroedit-local"
workers_dev = true

[[env.local.d1_databases]]
binding = "DB"
database_name = "syncroedit-local-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.local.durable_objects.bindings]]
name = "DOCUMENT_SYNC_OBJECT"
class_name = "SyncroDocumentObject"

[[env.local.durable_objects.bindings]]
name = "RATE_LIMIT_OBJECT"
class_name = "SyncroRateLimitObject"

[[env.local.migrations]]
tag = "v1"
new_sqlite_classes = ["SynchroDocumentObject"]

[[env.local.migrations]]
tag = "v2"
new_sqlite_classes = ["SynchroRateLimitObject"]

[[env.local.migrations]]
tag = "v3"
renamed_classes = [
  { from = "SynchroDocumentObject", to = "SyncroDocumentObject" },
  { from = "SynchroRateLimitObject", to = "SyncroRateLimitObject" },
]

[env.local.vars]
EMAIL_FROM = "SyncroEdit <verify@example.com>"
APP_NAME = "SyncroEdit"
APP_URL = "http://localhost:8787"

[env.staging]
name = "syncroedit-dev"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "syncroedit-dev-db"
database_id = "11ebe7c6-b238-43bd-906a-6a1fc651156f"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "DOCUMENT_SYNC_OBJECT"
class_name = "SyncroDocumentObject"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMIT_OBJECT"
class_name = "SyncroRateLimitObject"

[env.staging.vars]
EMAIL_FROM = "SyncroEdit <no-reply@syncroedit.online>"
APP_NAME = "SyncroEdit"
APP_URL = "https://syncroedit-dev.jordanvorster404.workers.dev"
