name = "syncroedit-dev"
main = "src-worker/index.js"
compatibility_date = "2026-06-10"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

[[d1_databases]]
binding = "DB"
database_name = "synchroedit-dev-db"
database_id = "11ebe7c6-b238-43bd-906a-6a1fc651156f"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "DOCUMENT_SYNC_OBJECT"
class_name = "SynchroDocumentObject"

[[durable_objects.bindings]]
name = "RATE_LIMIT_OBJECT"
class_name = "SynchroRateLimitObject"

[vars]
EMAIL_FROM = "SyncroEdit <no-reply@syncroedit.online>"
APP_NAME = "SyncroEdit"
APP_URL = "https://syncroedit-dev.jordanvorster404.workers.dev"

[env.local]
name = "syncroedit-local"
workers_dev = true

[[env.local.d1_databases]]
binding = "DB"
database_name = "syncroedit-local-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.local.durable_objects.bindings]]
name = "DOCUMENT_SYNC_OBJECT"
class_name = "SynchroDocumentObject"

[[env.local.durable_objects.bindings]]
name = "RATE_LIMIT_OBJECT"
class_name = "SynchroRateLimitObject"

[env.local.exports.SynchroDocumentObject]
type = "durable-object"
storage = "sqlite"

[env.local.exports.SynchroRateLimitObject]
type = "durable-object"
storage = "sqlite"

[env.local.vars]
EMAIL_FROM = "SyncroEdit <verify@example.com>"
APP_NAME = "SyncroEdit"
APP_URL = "http://localhost:8787"

[env.staging]
name = "syncroedit-dev"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "synchroedit-dev-db"
database_id = "11ebe7c6-b238-43bd-906a-6a1fc651156f"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "DOCUMENT_SYNC_OBJECT"
class_name = "SynchroDocumentObject"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMIT_OBJECT"
class_name = "SynchroRateLimitObject"

# Staging already owns these namespaces through the legacy migration history.
# Keep that lifecycle authoritative so Wrangler does not send both migrations
# and declarative exports for the same deployed Worker.
[[env.staging.migrations]]
tag = "v5"
renamed_classes = [
  { from = "SyncroDocumentObject", to = "SynchroDocumentObject" },
  { from = "SyncroRateLimitObject", to = "SynchroRateLimitObject" },
]

[env.staging.vars]
EMAIL_FROM = "SyncroEdit <no-reply@syncroedit.online>"
APP_NAME = "SyncroEdit"
APP_URL = "https://syncroedit-dev.jordanvorster404.workers.dev"
