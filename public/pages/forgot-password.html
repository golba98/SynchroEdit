<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncroEdit - Forgot Password</title>
    <script src="/js/dev-cache-reset.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/css/syncro.css" />
    <link rel="stylesheet" href="/css/pages/forgot-password.css" />
    <link rel="stylesheet" href="/css/pages/auth-mobile.css" />
  </head>
  <body data-page="forgot-password">
    <div class="login-container">
      <div class="left-section">
        <a class="auth-brand" href="/pages/login.html" aria-label="SyncroEdit login"
          ><img src="/logo.svg" alt="" width="36" height="36" /><span>SyncroEdit</span></a
        >
        <div class="title">Reset Password</div>
        <div class="subtitle">Enter your email to receive a reset link</div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            autocomplete="email"
          />
        </div>

        <button class="action-btn" id="sendBtn">Send Reset Link</button>
        <div class="status-message" id="statusMessage"></div>

        <div class="back-link">
          <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
      </div>

      <div class="right-section">
        <div class="character-container">
          <div class="bot-rig" id="botRig">
            <div class="antenna-stalk"></div>
            <div class="antenna-bulb"></div>
            <div class="head">
              <div class="face-screen">
                <div class="loader"></div>
                <div class="eyes-container">
                  <div class="eye left">
                    <div class="eyelid top"></div>
                    <div class="pupil"></div>
                    <div class="eyelid bottom"></div>
                  </div>
                  <div class="eye right">
                    <div class="eyelid top"></div>
                    <div class="pupil"></div>
                    <div class="eyelid bottom"></div>
                  </div>
                </div>
                <div class="mouth"></div>
              </div>
            </div>
            <div class="hands-container">
              <div class="hand left"></div>
              <div class="hand right"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
